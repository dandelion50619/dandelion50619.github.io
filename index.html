<!DOCTYPE html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>민들레 Dandelion</title>
<meta name="description" content="민들레 포트폴리오. Dandelion, painting, Seoul.">
<meta property="og:title" content="민들레 Dandelion">
<meta property="og:description" content="민들레 포트폴리오 · Dandelion portfolio">
<meta property="og:image" content="media/works/t/dry-drowning-7.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one quiet column system taken from the PDF portfolio.
     Small labels on the left, everything else starts at the same edge on the right.
     The page is the grey of the photographed gallery wall, so the works sit on it. */
  --wall:#F2F2F1;
  --ink:#1B1B1C;
  --graphite:#6A6A6E;
  --hairline:#DCDCDA;
  --alert:#9B2C2C;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  --gutter:clamp(16px,4vw,48px);
  --header-h:60px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.8;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
[data-lang="ko"] .en,[data-lang="en"] .ko{display:none!important}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
a:hover{color:var(--graphite)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
i{font-style:italic}
.wrap{max-width:1320px;margin:0 auto;padding-inline:var(--gutter)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--wall)}
[data-route="home"] .brand{visibility:hidden}

/* one view at a time: the cover, or the section picked in the menu */
.cover[hidden],main[hidden],footer[hidden],.room[hidden]{display:none}

/* cover: page 1 of the PDF, name and "portfolio" at 44% from the left, centred vertically */
.cover{position:relative;height:100vh;height:100svh;min-height:420px}
.cover a{position:absolute;left:44.3%;top:50%;transform:translateY(-50%);font-size:clamp(24px,3vw,46px);line-height:1.25;letter-spacing:-.005em;color:var(--ink)}
.cover a:hover{color:var(--ink)}
.cover a span{display:block}
main{padding-top:var(--header-h)}
.top .wrap{display:flex;align-items:center;gap:28px;min-height:var(--header-h);font-size:13px}
.brand{font-weight:500;letter-spacing:.02em}
.sections{display:flex;gap:24px;margin-left:auto}
.sections a{color:var(--graphite)}
.sections a:hover,.sections a[aria-current="true"]{color:var(--ink)}
.lang{display:flex;gap:8px;color:var(--graphite)}
.lang button{color:var(--graphite);letter-spacing:.04em}
.lang button[aria-pressed="true"]{color:var(--ink)}

/* rooms */
.room{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start;
  padding-block:40px 120px;scroll-margin-top:var(--header-h)}
.room>.label{grid-column:1/span 3;margin:0;font-size:13px;font-weight:400;color:var(--graphite)}
.room>.body{grid-column:4/-1;min-width:0}

/* works */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 28px}
.work{margin:0;display:flex;flex-direction:column;gap:12px}
.frame{position:relative;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;cursor:zoom-in}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.work figcaption{font-size:13px;line-height:1.5;color:var(--graphite)}
.work:hover figcaption{color:var(--ink)}

/* exhibition */
.ex-line{margin:0 0 32px}
.ex-line .venue{color:var(--graphite)}
.ex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ex-grid .frame{aspect-ratio:1.6}
.ex-grid .frame img{object-fit:cover}
.ex-poster{width:min(320px,100%);aspect-ratio:auto;margin:0 0 16px}
.ex-poster img{position:static;height:auto}

/* text */
.text p{margin:0 0 1.4em;max-width:38em;font-size:15px;line-height:1.95}
.text p.en{line-height:1.8}
.rows{margin:48px 0 0;font-variant-numeric:tabular-nums;max-width:52em}
.rows>div{display:grid;grid-template-columns:8em 4em minmax(0,1fr);column-gap:20px;padding:12px 0;border-top:1px solid var(--hairline)}
.rows dt,.rows .yr{color:var(--graphite)}
.rows dd{margin:0}
.rows.contact>div{grid-template-columns:8em minmax(0,1fr)}
.rows.contact a{border-bottom:1px solid var(--hairline)}

.foot{padding-block:24px 40px;border-top:1px solid var(--hairline);font-size:12px;color:var(--graphite)}

/* viewer */
.viewer{position:fixed;inset:0;z-index:50;display:grid;grid-template-rows:minmax(0,1fr) auto;background:var(--wall)}
.viewer[hidden]{display:none}
.viewer-stage{position:relative;min-height:0;touch-action:pan-y pinch-zoom}
.viewer-stage img{position:absolute;top:56px;left:var(--gutter);width:calc(100% - 2*var(--gutter));height:calc(100% - 72px);object-fit:contain}
.viewer-bar{display:flex;align-items:baseline;gap:12px 24px;padding:14px var(--gutter) 22px;font-size:13px;line-height:1.6}
.viewer-cap{flex:1;margin:0;min-width:0}
.viewer-bar button,.viewer-close{color:var(--graphite)}
.viewer-bar button:hover,.viewer-close:hover{color:var(--ink)}
.viewer-bar button[disabled]{visibility:hidden}
.viewer-count{color:var(--graphite);font-variant-numeric:tabular-nums}
.viewer-close{position:absolute;top:16px;right:var(--gutter);font-size:13px}

@media (max-width:900px){
  .room>.label,.room>.body{grid-column:1/-1}
  .room>.label{margin-bottom:24px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 16px}
}
@media (max-width:640px){
  :root{--header-h:88px}
  .top .wrap{flex-wrap:wrap;gap:4px 16px;padding-block:14px 10px}
  .lang{margin-left:auto}
  .sections{order:3;width:100%;margin:0;gap:20px;overflow-x:auto}
  .ex-grid{grid-template-columns:1fr;gap:10px}
  .two{grid-template-columns:1fr}
  .rows>div{grid-template-columns:3.6em minmax(0,1fr)}
  .rows dt{grid-column:1/-1}
  .rows.contact>div{grid-template-columns:1fr}
  .viewer-bar{flex-wrap:wrap}
  .viewer-cap{flex-basis:100%}
}
/* soap-bubble cursor: drawn on one canvas above everything, never catches clicks */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}
.fx-on body,.fx-on body *{cursor:none!important}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#fx{display:none}}
.notice{color:var(--graphite);font-size:13px}
</style>
</head>
<body>
<div class="cover" id="top">
  <a href="#works"><span><span class="ko">민들레</span><span class="en">Dandelion</span></span><span>portfolio</span></a>
</div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top"><span class="ko">민들레</span><span class="en">Dandelion</span></a>
    <nav class="sections" aria-label="섹션 / Sections">
      <a href="#works"><span class="ko">작업</span><span class="en">Works</span></a>
      <a href="#exhibition"><span class="ko">전시</span><span class="en">Exhibition</span></a>
      <a href="#statement"><span class="ko">작가노트</span><span class="en">Statement</span></a>
      <a href="#about"><span class="ko">소개</span><span class="en">About</span></a>
    </nav>
    <div class="lang" role="group" aria-label="언어 / Language">
      <button type="button" data-set-lang="ko" aria-pressed="true">KO</button>
      <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="room" id="works">
    <h2 class="label"><span class="ko">작업</span><span class="en">Works</span></h2>
    <div class="body"><div class="grid" id="works-grid"></div></div>
  </section>

  <section class="room" id="exhibition">
    <h2 class="label"><span class="ko">전시</span><span class="en">Exhibition</span></h2>
    <div class="body" id="exhibitions"></div>
  </section>

  <section class="room" id="statement">
    <h2 class="label"><span class="ko">작가노트</span><span class="en">Artist Statement</span></h2>
    <div class="body text" id="statement-body"></div>
  </section>

  <section class="room" id="about">
    <h2 class="label"><span class="ko">소개</span><span class="en">About</span></h2>
    <div class="body text">
      <div id="bio"></div>
      <dl class="rows" id="cv"></dl>
      <dl class="rows contact" id="contact"></dl>
    </div>
  </section>
</main>

<footer class="wrap" id="foot">
  <div class="foot">© <span id="year"></span> <span class="ko">민들레</span><span class="en">Dandelion</span></div>
</footer>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-cap" hidden>
  <div class="viewer-stage" id="viewer-stage">
    <img id="viewer-img" alt="">
    <button type="button" class="viewer-close" id="viewer-close"><span class="ko">닫기</span><span class="en">Close</span></button>
  </div>
  <div class="viewer-bar">
    <p class="viewer-cap" id="viewer-cap"></p>
    <button type="button" id="viewer-prev"><span class="ko">이전</span><span class="en">Prev</span></button>
    <span class="viewer-count" id="viewer-count"></span>
    <button type="button" id="viewer-next"><span class="ko">다음</span><span class="en">Next</span></button>
  </div>
</div>

<script>
(() => {
  /* Content lives in data/*.json and is edited through Pages CMS (.pages.yml). */
  const root = document.documentElement;
  const $ = id => document.getElementById(id);
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // *text* becomes italics (for English titles); everything else is plain text
  const fmt = v => esc(v).replace(/\*([^*]+)\*/g, '<i>$1</i>');
  // paths saved by the CMS start with "/"; make them relative so the site also works under a sub-folder
  const url = p => String(p || '').replace(/^\/+/, '');
  // small copies are made automatically when the site is published: media/works/a.jpg -> media/works/t/a.jpg
  const thumb = p => url(p).replace(/([^\/]+)$/, 't/$1');
  const img = (p, alt) => `<img src="${esc(thumb(p))}" data-full="${esc(url(p))}" onerror="this.onerror=null;this.src=this.dataset.full" loading="lazy" decoding="async" alt="${esc(alt)}">`;
  const bi = (ko, en, tag = 'span', cls = '') => `<${tag} class="ko ${cls}" lang="ko">${ko}</${tag}><${tag} class="en ${cls}" lang="en">${en || ko}</${tag}>`;

  let WORKS = [], EXS = [], VIEW = {};
  function caption(w, lang, detail){
    const ko = lang === 'ko';
    const t = ko ? `〈${esc(w.title_ko)}〉` : `<i>${esc(w.title_en || w.title_ko)}</i>`;
    const parts = [ko ? '민들레' : 'Dandelion', t + (detail ? (ko ? '(부분)' : ' (detail)') : ''), esc(w.year),
      esc(ko ? w.medium_ko : (w.medium_en || w.medium_ko)), esc(ko ? w.size_ko : (w.size_en || w.size_ko))];
    return parts.filter(Boolean).join(', ');
  }
  function renderWorks(){
    $('works-grid').innerHTML = WORKS.map((w, i) => {
      const p = (w.photos || [])[0] || {};
      return `<figure class="work"><button class="frame" type="button" data-set="w${i}" data-img="0">`
        + img(p.src, `${w.title_ko || ''} ${w.title_en || ''}, ${w.year || ''}`) + `</button>`
        + `<figcaption>${bi('〈' + esc(w.title_ko) + '〉', '<i>' + esc(w.title_en || w.title_ko) + '</i>')}${w.year ? ', ' + esc(w.year) : ''}</figcaption></figure>`;
    }).join('');
    WORKS.forEach((w, i) => { VIEW['w' + i] = (w.photos || []).map(p => ({ src: url(p.src), ko: caption(w, 'ko', p.detail), en: caption(w, 'en', p.detail) })); });
  }
  function renderExhibitions(){
    $('exhibitions').innerHTML = EXS.map((x, i) => {
      const place = (v, y) => [esc(v), esc(y)].filter(Boolean).join(', ');
      const ko = `《${esc(x.title_ko)}》 <span class="venue">${place(x.venue_ko, x.year)}</span>`;
      const en = `<i>${esc(x.title_en || x.title_ko)}</i> <span class="venue">${place(x.venue_en || x.venue_ko, x.year)}</span>`;
      // the poster (optional) opens first in the viewer, then the installation views
      const items = (x.poster ? [{ src: x.poster, poster: true }] : []).concat(x.photos || []);
      VIEW['x' + i] = items.map(p => ({
        src: url(p.src),
        ko: p.poster ? `《${esc(x.title_ko)}》 포스터` : `《${esc(x.title_ko)}》 전시 전경, ${place(x.venue_ko, x.year)}`,
        en: p.poster ? `<i>${esc(x.title_en || x.title_ko)}</i>, poster` : `Installation view, <i>${esc(x.title_en || x.title_ko)}</i>, ${place(x.venue_en || x.venue_ko, x.year)}`
      }));
      const off = x.poster ? 1 : 0;
      const poster = x.poster ? `<button class="frame ex-poster" type="button" data-set="x${i}" data-img="0">${img(x.poster, `${x.title_ko || ''} 포스터`)}</button>` : '';
      const grid = (x.photos || []).map((p, j) => `<button class="frame" type="button" data-set="x${i}" data-img="${j + off}">${img(p.src, `${x.title_ko || ''} 전시 전경 ${j + 1}`)}</button>`).join('');
      return `<div class="exhibit"${i ? ' style="margin-top:96px"' : ''}><p class="ex-line">${bi(ko, en)}</p>${poster}<div class="ex-grid">${grid}</div></div>`;
    }).join('');
  }
  const paras = s => String(s || '').split(/\n\s*\n/).map(t => t.trim()).filter(Boolean);
  function renderStatement(st){
    $('statement-body').innerHTML = paras(st.ko).map(p => `<p class="ko" lang="ko">${fmt(p)}</p>`).join('')
      + paras(st.en).map(p => `<p class="en" lang="en">${fmt(p)}</p>`).join('');
  }
  function renderAbout(a){
    $('bio').innerHTML = paras(a.bio_ko).map(p => `<p class="ko" lang="ko">${fmt(p)}</p>`).join('') + paras(a.bio_en).map(p => `<p class="en" lang="en">${fmt(p)}</p>`).join('');
    $('cv').innerHTML = (a.cv || []).map(r => `<div><dt>${bi(esc(r.category_ko), esc(r.category_en))}</dt><dd class="yr">${esc(r.year)}</dd><dd>${bi(fmt(r.entry_ko), fmt(r.entry_en))}</dd></div>`).join('');
    const ig = String(a.instagram || '').replace(/^@/, '');
    $('contact').innerHTML = (a.email ? `<div><dt>E-mail</dt><dd><a href="mailto:${esc(a.email)}">${esc(a.email)}</a></dd></div>` : '')
      + (ig ? `<div><dt>Instagram</dt><dd><a href="https://www.instagram.com/${esc(ig)}/" rel="noopener">@${esc(ig)}</a></dd></div>` : '');
  }

  /* ---------- viewer ---------- */
  const viewer = $('viewer'), vImg = $('viewer-img'), vCap = $('viewer-cap'), vCount = $('viewer-count'),
        vPrev = $('viewer-prev'), vNext = $('viewer-next'), vClose = $('viewer-close'), stage = $('viewer-stage');
  let cur = { set: '', i: 0 }, lastFocus = null;
  const list = () => VIEW[cur.set] || [];
  function render(){
    const L = list(), it = L[cur.i]; if (!it) return;
    vImg.src = it.src; vCap.innerHTML = it[root.dataset.lang]; vImg.alt = vCap.textContent;
    vCount.textContent = L.length > 1 ? `${cur.i + 1} / ${L.length}` : '';
    vPrev.disabled = vNext.disabled = L.length < 2;
    [1, -1].forEach(d => { const n = L[(cur.i + d + L.length) % L.length]; if (n) new Image().src = n.src; });
  }
  function open(set, i){ cur = { set, i }; lastFocus = document.activeElement; viewer.hidden = false; document.body.style.overflow = 'hidden'; render(); vClose.focus(); }
  function close(){ viewer.hidden = true; document.body.style.overflow = ''; if (lastFocus) lastFocus.focus(); }
  function step(d){ const L = list(); if (L.length < 2) return; cur.i = (cur.i + d + L.length) % L.length; render(); }
  document.addEventListener('click', e => { const b = e.target.closest('[data-set]'); if (b) open(b.dataset.set, +b.dataset.img || 0); });
  vClose.addEventListener('click', close); vPrev.addEventListener('click', () => step(-1)); vNext.addEventListener('click', () => step(1));
  stage.addEventListener('click', e => { if (e.target === stage) close(); });
  let sx = null;
  stage.addEventListener('pointerdown', e => { sx = e.clientX; });
  stage.addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); });
  document.addEventListener('keydown', e => {
    if (viewer.hidden) return;
    if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'Tab') { const f = [...viewer.querySelectorAll('button:not([disabled])')]; const i = f.indexOf(document.activeElement); e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); }
  });

  /* ---------- language ---------- */
  function setLang(l, save){
    root.dataset.lang = l; root.lang = l;
    document.querySelectorAll('[data-set-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setLang === l)));
    if (save) store.set('dandelion-lang', l);
    if (!viewer.hidden) render();
  }
  document.querySelectorAll('[data-set-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.setLang, true)));

  /* ---------- menu: one view at a time ---------- */
  const links = [...document.querySelectorAll('.sections a')];
  const ROUTES = ['works', 'exhibition', 'statement', 'about'];
  function route(){
    const h = location.hash.slice(1), r = ROUTES.includes(h) ? h : 'home';
    root.dataset.route = r;
    $('top').hidden = r !== 'home';
    document.querySelector('main').hidden = $('foot').hidden = r === 'home';
    document.querySelectorAll('main > section').forEach(s => { s.hidden = s.id !== r; });
    links.forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + r)));
    if (!viewer.hidden) close();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();

  (function foam(){
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = document.getElementById('fx'), g = cv.getContext('2d');
    if (!g) return;
    const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
    let W = 0, H = 0, raf = 0;
    const TAU = Math.PI * 2;
    function size(){
      const d = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0);
    }
    size();
    addEventListener('resize', () => { size(); kick(); });
    const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };

    function bubble(x, y, r, a){
      g.beginPath(); g.arc(x, y, r, 0, TAU);
      g.fillStyle = `rgba(255,255,255,${0.2 * a})`; g.fill();
      g.lineWidth = 1; g.strokeStyle = `rgba(27,27,28,${0.5 * a})`; g.stroke();
      if (r > 6) { g.beginPath(); g.arc(x, y, r + 1, 0, TAU); g.strokeStyle = `rgba(255,255,255,${0.55 * a})`; g.stroke(); }
      g.beginPath(); g.arc(x, y, r * 0.84, Math.PI * 0.15, Math.PI * 0.62);
      g.strokeStyle = `rgba(125,97,119,${0.4 * a})`; g.lineWidth = 1; g.stroke();
      g.beginPath(); g.arc(x, y, r * 0.7, Math.PI * 1.08, Math.PI * 1.45);
      g.strokeStyle = `rgba(255,255,255,${0.95 * a})`; g.lineWidth = Math.max(1, r * 0.13); g.stroke();
    }
    function popped(p){
      const t = p.pop, k = 1 - t;
      g.beginPath(); g.arc(p.x, p.y, p.r * (1 + t), 0, TAU);
      g.strokeStyle = `rgba(27,27,28,${0.35 * k})`; g.lineWidth = 1; g.stroke();
      for (let i = 0; i < 5; i++) {
        const an = i * 1.2566 + p.r, d = p.r * (1 + t * 1.8);
        g.beginPath(); g.arc(p.x + Math.cos(an) * d, p.y + Math.sin(an) * d, Math.max(0.6, p.r * 0.12 * k), 0, TAU);
        g.fillStyle = `rgba(27,27,28,${0.4 * k})`; g.fill();
      }
    }
    const P = [];
    function spawn(x, y, n, big){
      for (let i = 0; i < n && P.length < 90; i++) P.push({
        x: x + (Math.random() - 0.5) * 12, y: y + (Math.random() - 0.5) * 12,
        r: (big ? 2.5 : 1.3) + Math.random() * (big ? 6 : 3.8),
        vx: (Math.random() - 0.5) * 0.5, vy: -0.15 - Math.random() * 0.55,
        life: 0, max: 50 + Math.random() * 90, pop: 0
      });
    }
    const cur = { x: 0, y: 0, tx: 0, ty: 0, r: 9, tr: 9, show: false, hide: false };
    let lx = null, ly = null, acc = 0;
    addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse') return;
      cur.tx = e.clientX; cur.ty = e.clientY;
      if (!cur.show) { cur.x = cur.tx; cur.y = cur.ty; cur.show = true; }
      if (lx !== null) {
        acc += Math.hypot(e.clientX - lx, e.clientY - ly);
        while (acc > 18) { acc -= 18; if (Math.random() < 0.55) spawn(e.clientX, e.clientY, 1, false); }
      }
      lx = e.clientX; ly = e.clientY;
      const t = e.target instanceof Element ? e.target : document.body;
      cur.hide = !!t.closest('.panel');
      cur.tr = t.closest('.frame') ? 30 : (t.closest('a, button, label') ? 15 : 9);
      kick();
    }, { passive: true });
    document.addEventListener('mouseout', e => { if (!e.relatedTarget) { cur.show = false; lx = null; kick(); } });
    addEventListener('pointerdown', e => {
      if (e.pointerType === 'mouse') {
        if (!cur.hide) { P.push({ x: cur.x, y: cur.y, r: cur.r, pop: 0.001 }); cur.r = 2; }
      } else spawn(e.clientX, e.clientY, 7, true);
      kick();
    }, { passive: true });

    function frame(){
      raf = 0;
      g.clearRect(0, 0, W, H);
      let busy = false;
      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i];
        if (p.pop > 0) {
          p.pop += 0.1;
          if (p.pop >= 1) { P.splice(i, 1); continue; }
          popped(p); busy = true; continue;
        }
        p.life++;
        p.x += p.vx + Math.sin((p.life + p.r * 10) * 0.05) * 0.15; p.y += p.vy;
        if (p.life >= p.max) p.pop = 0.001;
        bubble(p.x, p.y, p.r, Math.min(1, p.life / 8) * 0.9); busy = true;
      }
      if (cur.show && !cur.hide) {
        cur.x += (cur.tx - cur.x) * 0.25; cur.y += (cur.ty - cur.y) * 0.25; cur.r += (cur.tr - cur.r) * 0.2;
        bubble(cur.x, cur.y, cur.r, 1);
        g.beginPath(); g.arc(cur.tx, cur.ty, 2, 0, TAU); g.fillStyle = 'rgba(27,27,28,.9)'; g.fill();
        if (Math.abs(cur.tx - cur.x) > 0.2 || Math.abs(cur.ty - cur.y) > 0.2 || Math.abs(cur.tr - cur.r) > 0.1) busy = true;
      }
      if (busy) kick();
    }
    if (fine) root.classList.add('fx-on');
  })();

  /* ---------- load content ---------- */
  $('year').textContent = new Date().getFullYear();
  const get = name => fetch(`data/${name}.json`, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(name); return r.json(); });
  Promise.all([get('works'), get('exhibitions'), get('statement'), get('about')]).then(([w, x, s, a]) => {
    WORKS = Array.isArray(w) ? w : []; EXS = Array.isArray(x) ? x : [];
    renderWorks(); renderExhibitions(); renderStatement(s || {}); renderAbout(a || {});
  }).catch(() => {
    document.querySelectorAll('main .body').forEach(b => { b.insertAdjacentHTML('afterbegin', '<p class="notice">내용을 불러오지 못했어요. 잠시 후 새로 고쳐 주세요.</p>'); });
  });

  const saved = store.get('dandelion-lang'), nav = (navigator.language || 'ko').toLowerCase();
  setLang(saved === 'ko' || saved === 'en' ? saved : (nav.startsWith('ko') ? 'ko' : 'en'), false);
})();
</script>
</body>
</html>
